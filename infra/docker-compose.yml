# infra/docker-compose.yml
#
# Skeleton only (Phase 0 scaffolding) — no business logic yet.
# `backend/`, `cv-service/`, and `frontend/` don't have Dockerfiles yet;
# those and the real service internals land in Phases 1-4. This file exists
# so later phases can slot their service in without redesigning the
# orchestration. Phase 5 wires this into a real working stack.
#
# Usage once services are implemented:
#   cp .env.example .env   # fill in real values
#   docker compose up --build

services:
  postgres:
    image: postgres:16-alpine
    container_name: anpr-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: anpr-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    # TODO(Phase 3): add backend/Dockerfile — this build context will fail
    # until then.
    build:
      context: ../backend
    container_name: anpr-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  cv-service:
    # TODO(Phase 1-2): add cv-service/Dockerfile — this build context will
    # fail until then.
    build:
      context: ../cv-service
    container_name: anpr-cv-service
    restart: unless-stopped
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379
    # Placeholder for gate camera config / evidence storage / model weights
    # mounts — finalized in Phase 2 (live RTSP) and Phase 5 (deployment).
    volumes:
      - cv_evidence:/data/evidence
    depends_on:
      redis:
        condition: service_healthy

  frontend:
    # TODO(Phase 4): add frontend/Dockerfile — this build context will fail
    # until then.
    build:
      context: ../frontend
    container_name: anpr-frontend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      VITE_API_BASE_URL: http://localhost:${BACKEND_PORT:-8000}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  cv_evidence:
